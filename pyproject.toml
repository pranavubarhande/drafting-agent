[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drafting-agent"
version = "0.1.0"
description = "Self-checking drafting agent with a closed learning loop and eval harness"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "pydantic>=2",
    "typer>=0.12",
    "rich>=13",
    "scipy>=1.11",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
drafting-agent = "drafting_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/drafting_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
